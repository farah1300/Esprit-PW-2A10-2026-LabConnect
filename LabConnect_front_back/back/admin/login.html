<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4A1E56">
  <title>LabConnect – Connexion admin</title>
  <link rel="icon" href="/images/favicon.png">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ========== LOGIN ========== -->
  <div class="login-wrap">
    <form class="login" id="f">
      <h1>LabConnect</h1>
      <p>Espace administrateur</p>

      <label for="u">E-mail ou identifiant</label>
      <input id="u" name="username" placeholder="admin@labconnect.tn" autocomplete="username" required autofocus>

      <label for="p">Mot de passe</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>

      <button class="btn full" type="submit">Se connecter</button>
      <div class="err" id="err" role="alert" aria-live="assertive"></div>
      <div class="login-back">
        <a href="/connexion.html">← Retour à la page de connexion</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('f').addEventListener('submit', async (event) => {
      event.preventDefault();

      const err = document.getElementById('err');
      err.textContent = '';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('u').value,
            password: document.getElementById('p').value
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          location.href = '/admin/';
        } else {
          err.textContent = data.error || 'Identifiants incorrects.';
        }
      } catch (error) {
        err.textContent = 'Impossible de contacter le serveur.';
      }
    });
  </script>
</body>
</html>

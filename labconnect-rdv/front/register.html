<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription | LabConnect</title>
  <link rel="icon" href="../public/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../public/css/variables.css" rel="stylesheet">
  <link href="../public/css/front.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-front sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-primary" href="rdv_start.html"><img src="../public/img/logo.png" class="brand-logo" alt="logo"> LabConnect</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link active" href="rdv_start.html">Prendre un RDV</a></li>
      </ul>
      <a href="login.html" class="btn btn-outline-primary me-2">Connexion</a><a href="register.html" class="btn btn-primary">Inscription</a>
    </div>
  </div>
</nav>
<main>
<div class="container"><div class="card auth-card p-4 p-md-5" style="max-width:560px">
<div class="text-center mb-4"><img src="../public/img/logo.png" width="72" class="rounded-circle mb-2" alt=""><h2 class="text-primary fw-bold">Créer mon compte</h2><p class="text-muted small mb-0">Une fois inscrit, vous pourrez réserver votre rendez-vous.</p></div>
<form method="get" action="rdv_create.html"><div class="row g-3">
<div class="col-6"><label class="form-label">Nom</label><input type="text" name="nom" class="form-control" required></div>
<div class="col-6"><label class="form-label">Prénom</label><input type="text" name="prenom" class="form-control" required></div>
<div class="col-12"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
<div class="col-12"><label class="form-label">Mot de passe</label><input type="password" name="mot_de_passe" class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Téléphone</label><input type="tel" name="telephone" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Date de naissance</label><input type="date" name="date_naissance" class="form-control"></div>
<div class="col-12"><label class="form-label d-block">Sexe</label>
<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sexe" value="H" id="sH"><label class="form-check-label" for="sH">Homme</label></div>
<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="sexe" value="F" id="sF"><label class="form-check-label" for="sF">Femme</label></div></div>
<div class="col-12"><label class="form-label">Adresse</label><input type="text" name="adresse" class="form-control"></div>
<div class="col-12"><button class="btn btn-primary w-100">Créer mon compte et continuer</button></div></div></form>
<p class="text-center mt-3 mb-0">Déjà inscrit ? <a href="login.html">Connectez-vous</a></p></div></div>
</main>
<footer class="footer-front mt-5 py-4">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span>&copy; 2026 LabConnect. Tous droits réservés.</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../public/js/app.js"></script>
</body>
</html>

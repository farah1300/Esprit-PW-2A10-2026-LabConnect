<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion administrateur | LabConnect</title>
  <link rel="icon" href="../public/img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../public/css/variables.css" rel="stylesheet">
  <link href="../public/css/front.css" rel="stylesheet">
</head>
<body>
<main class="container">
  <div class="card auth-card p-4 p-md-5">
    <div class="text-center mb-4"><img src="../public/img/logo.png" width="72" class="rounded-circle mb-2" alt="">
      <h2 class="text-primary fw-bold">Espace administration</h2>
      <p class="text-muted small mb-0">Accès réservé aux administrateurs du laboratoire.</p></div>
    <div class="alert alert-danger d-none" id="adminError"><i class="bi bi-exclamation-triangle"></i> Email ou mot de passe incorrect.</div>
    <form method="post" action="#" data-form="admin-login">
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Mot de passe</label><input type="password" name="mot_de_passe" class="form-control" required></div>
      <button class="btn btn-primary w-100">Se connecter</button>
    </form>
    <p class="text-center text-muted small mt-3 mb-0">Démo : admin@labconnect.tn / admin123</p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../public/js/app.js"></script>
</body>
</html>
